<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0c;color:#e0e0e0;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100vh;width:100vw}
canvas{display:block;position:fixed;top:0;left:0;z-index:1}
.loader-overlay{position:fixed;inset:0;z-index:100;background:#0c0c0c;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1.2s ease,visibility 1.2s ease}
.loader-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-bar{display:flex;gap:4px;align-items:center}
.loader-block{width:28px;height:28px;border:1px solid #333;background:transparent;transition:background 0.3s ease,box-shadow 0.3s ease}
.loader-block.active{background:#e0e0e0;box-shadow:0 0 8px rgba(224,224,224,0.3)}
.ui-wrap{opacity:0;transition:opacity 1.5s ease 0.5s}
.ui-wrap.visible{opacity:1}
.logo{position:fixed;top:30px;left:30px;z-index:10;font-family:'Oswald',sans-serif;font-size:2.6rem;font-weight:700;letter-spacing:6px;color:#f0eded;text-transform:uppercase;text-shadow:3px 3px 0px rgba(255,100,130,0.35),-1px -1px 0px rgba(100,200,255,0.15);user-select:none}
.info{position:fixed;bottom:30px;left:30px;z-index:10;max-width:550px}
.info .label{color:#777;font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.info .time-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.info .time-big{font-size:3.2rem;font-family:'Oswald',sans-serif;font-weight:700;color:#fff;line-height:1;letter-spacing:2px}
.info .ampm{display:flex;flex-direction:column;font-size:0.55rem;color:#888;line-height:1.3}
.info .bio{border-left:1px solid #444;padding-left:14px;font-size:0.95rem;color:#ccc;line-height:1.5}
.info .bio b{color:#fff;font-weight:400}
.info .stats{margin-top:12px;font-size:0.6rem;color:#555;text-transform:uppercase;letter-spacing:1px;line-height:1.6}
.links{position:fixed;bottom:30px;right:30px;z-index:10;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.links a{color:#777;text-decoration:none;font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;transition:color .3s,border-color .3s;border-bottom:1px solid transparent;padding-bottom:2px}
.links a:hover{color:#fff;border-color:#fff}
.fps{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;font-size:0.6rem;color:#444;text-transform:uppercase;letter-spacing:1px}
.redirect-overlay{position:fixed;inset:0;z-index:200;background:#0c0c0c;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s ease}
.redirect-overlay.show{opacity:1;visibility:visible}
.redirect-text{font-family:'Oswald',sans-serif;font-size:1.2rem;color:#888;letter-spacing:4px;text-transform:uppercase;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.redirect-bar{width:200px;height:2px;background:#222;margin-top:20px;border-radius:1px;overflow:hidden}
.redirect-bar-fill{height:100%;background:#fff;width:0%;transition:width 0.1s linear;border-radius:1px}

/* ── MÜZİK İKONU ── */
.music-btn{position:fixed;top:30px;right:30px;z-index:10;width:40px;height:40px;border:1px solid #444;border-radius:50%;background:rgba(12,12,12,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 0.3s}
.music-btn:hover{border-color:#fff}
.music-btn svg{width:16px;height:16px;fill:#aaa;transition:fill 0.3s}
.music-btn.playing svg{fill:#fff}
.music-btn .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.music-btn .bar{width:3px;background:#aaa;border-radius:1px;animation:none}
.music-btn.playing .bar{background:#fff}
.music-btn.playing .bar:nth-child(1){animation:bar1 0.8s ease infinite}
.music-btn.playing .bar:nth-child(2){animation:bar2 0.6s ease infinite}
.music-btn.playing .bar:nth-child(3){animation:bar3 0.9s ease infinite}
.music-btn.playing .bar:nth-child(4){animation:bar1 0.7s ease infinite}
@keyframes bar1{0%,100%{height:4px}50%{height:14px}}
@keyframes bar2{0%,100%{height:8px}50%{height:4px}}
@keyframes bar3{0%,100%{height:6px}50%{height:12px}}
</style>
</head>
<body>

<!-- YÖNLENDİRME -->
<div class="redirect-overlay" id="redirectOverlay">
  <div class="redirect-text">YÖNLENDİRİLİYOR...</div>

<div class="loader-overlay" id="loader">
  <div class="loader-bar" id="loaderBar"></div>

<!-- MÜZİK BUTONU -->
<div class="music-btn" id="musicBtn" title="Müzik Aç/Kapat">

<!-- UI -->
<div class="ui-wrap" id="uiWrap">

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ══════════════════════════════════════
   1) MÜZİK SİSTEMİ — ASLA KAPANMAZ
   ══════════════════════════════════════
   
   localStorage ile sayfalar arası senkronizasyon:
   - index.html → 1.html → 2.html geçişlerinde
     müzik kaldığı yerden devam eder.
   
   KULLANIM:
   - Aynı klasöre "music.mp3" dosyasını koyun
   - Veya MUSIC_SRC değişkenini kendi dosya yolunuzla değiştirin
   - Dosya yoksa otomatik ambient müzik üretilir
*/
const MUSIC_SRC = 'music.mp3'; // ← Kendi müzik dosyanızı buraya koyun
const SYNC_KEY = 'akalınsoft_music_sync';
const REDIRECT_SECONDS = 7;
const REDIRECT_URL = '1.html';

let audioCtx, bgAudio, isMusicPlaying = false, redirectStarted = false;

// ── Ambient Müzik Üreteci (dosya yoksa) ──
function createAmbientGenerator() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 3);
  master.connect(audioCtx.destination);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  filter.Q.value = 0.7;
  master.disconnect();
  master.connect(filter);
  filter.connect(audioCtx.destination);

  function drone(freq, vol) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = vol;
    o.connect(g);
    g.connect(master);
    o.start();
    return o;
  }

  drone(55, 0.35);
  drone(55.4, 0.25);
  drone(82.5, 0.2);
  drone(110, 0.15);
  drone(110.3, 0.1);

  const shimmer = drone(220, 0.04);
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoG = audioCtx.createGain();
  lfoG.gain.value = 2;
  lfo.connect(lfoG);
  lfoG.connect(shimmer.frequency);
  lfo.start();

  const lfo2 = audioCtx.createOscillator();
  lfo2.frequency.value = 0.03;
  const lfo2G = audioCtx.createGain();
  lfo2G.gain.value = 180;
  lfo2.connect(lfo2G);
  lfo2G.connect(filter.frequency);
  lfo2.start();

  isMusicPlaying = true;
  document.getElementById('musicBtn').classList.add('playing');
}

// ── MP3 Senkronizasyonlu Müzik ──
function initMusic() {
  bgAudio = new Audio();
  bgAudio.src = MUSIC_SRC;
  bgAudio.loop = true;
  bgAudio.volume = 0.35;
  bgAudio.preload = 'auto';

  bgAudio.addEventListener('loadedmetadata', () => {
    const sync = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
    if (sync && bgAudio.duration) {
      const elapsed = (Date.now() - sync.ts) / 1000;
      bgAudio.currentTime = (sync.ct + elapsed) % bgAudio.duration;
    }
    bgAudio.play().then(() => {
      isMusicPlaying = true;
      document.getElementById('musicBtn').classList.add('playing');
    }).catch(() => {
      document.addEventListener('click', () => {
        bgAudio.play();
        isMusicPlaying = true;
        document.getElementById('musicBtn').classList.add('playing');
      }, { once: true });
    });
  });

  bgAudio.addEventListener('error', () => {
    console.log('music.mp3 bulunamadı → ambient müzik üretiliyor');
    createAmbientGenerator();
  });

  bgAudio.load();

  // Düzenli senkronizasyon kaydı
  setInterval(() => {
    if (bgAudio && !bgAudio.paused && bgAudio.duration) {
      localStorage.setItem(SYNC_KEY, JSON.stringify({
        ts: Date.now(),
        ct: bgAudio.currentTime
      }));
    }
  }, 500);
}

// ── Müzik Butonu ──
document.getElementById('musicBtn').addEventListener('click', () => {
  if (bgAudio) {
    if (bgAudio.paused) {
      bgAudio.play();
      isMusicPlaying = true;
    } else {
      bgAudio.pause();
      isMusicPlaying = false;
    }
  } else if (audioCtx) {
    if (audioCtx.state === 'running') {
      audioCtx.suspend();
      isMusicPlaying = false;
    } else {
      audioCtx.resume();
      isMusicPlaying = true;
    }
  }
  document.getElementById('musicBtn').classList.toggle('playing', isMusicPlaying);
});

// ── YÖNLENDİRME (7 SANİYE) ──
function startRedirect() {
  if (redirectStarted) return;
  redirectStarted = true;
  const overlay = document.getElementById('redirectOverlay');
  const barFill = document.getElementById('redirectBarFill');
  overlay.classList.add('show');
  let elapsed = 0;
  const iv = setInterval(() => {
    elapsed += 50;
    barFill.style.width = Math.min(100, (elapsed / (REDIRECT_SECONDS * 1000)) * 100) + '%';
    if (elapsed >= REDIRECT_SECONDS * 1000) {
      clearInterval(iv);
      window.location.href = REDIRECT_URL;
    }
  }, 50);
}
setTimeout(startRedirect, REDIRECT_SECONDS * 1000);

// ── YÜKLEME BARI ──
const LOADER_COUNT = 8;
const loaderBarEl = document.getElementById('loaderBar');
const loaderBlocks = [];
for (let i = 0; i < LOADER_COUNT; i++) {
  const d = document.createElement('div');
  d.className = 'loader-block';
  loaderBarEl.appendChild(d);
  loaderBlocks.push(d);
}

let loaderDone = false;

async function fillLoader() {
  for (let i = 0; i < LOADER_COUNT; i++) {
    await new Promise(r => setTimeout(r, 250));
    loaderBlocks[i].classList.add('active');
  }
  await new Promise(r => setTimeout(r, 600));
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('uiWrap').classList.add('visible');
  loaderDone = true;
}

// ── SAAT ──
function tick() {
  document.getElementById('clock').textContent =
    new Intl.DateTimeFormat('tr-TR', {
      timeZone: 'Europe/Istanbul',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).format(new Date());
}
tick(); setInterval(tick, 1000);

/* ══════════════════════════════════════
   2) THREE.JS — 3D KÜPLER
   ══════════════════════════════════════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c0c);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8, 6.5, 10);
camera.lookAt(0, 0.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xfff5ee, 1.4);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xe0e8ff, 0.3).translateX(-5).translateY(4).translateZ(-3));

const pinkA = new THREE.PointLight(0xff4466, 3.5, 18);
pinkA.position.set(0, -2.5, 0);
scene.add(pinkA);
const pinkB = new THREE.PointLight(0xff2255, 2, 12);
pinkB.position.set(2, -1.5, 2);
scene.add(pinkB);
const pinkC = new THREE.PointLight(0xff6688, 1.5, 10);
pinkC.position.set(-2, -2, -1);
scene.add(pinkC);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.25 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.5;
floor.receiveShadow = true;
scene.add(floor);

const cubeMat = new THREE.MeshPhysicalMaterial({ color: 0xf2ecea, metalness: 0.0, roughness: 0.18, clearcoat: 1.0, clearcoatRoughness: 0.04, reflectivity: 0.8 });
const cubeMatPink = new THREE.MeshPhysicalMaterial({ color: 0xf8eff0, metalness: 0.0, roughness: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.04, emissive: 0xff3355, emissiveIntensity: 0.08 });

const CUBE_SIZE = 0.82, GAP = 1.02, RADIUS = 0.13, SEGMENTS = 5;
const W = 5, H = 5, D = 4, MAX_ROW = 4;
const ox = -(W - 1) / 2, oy = -(H - 1) / 2, oz = -(D - 1) / 2;
const geo = new RoundedBoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, SEGMENTS, RADIUS);
const allCubes = [];

const skipSet = new Set(['0,4,0','0,4,1','1,4,0','4,4,3','3,4,3','4,3,3','2,1,2','2,2,2','0,0,0','0,0,1','1,0,0']);

for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) for (let z = 0; z < D; z++) {
  if (skipSet.has(`${x},${y},${z}`)) continue;
  const mesh = new THREE.Mesh(geo, y <= 1 ? cubeMatPink : cubeMat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const target = new THREE.Vector3((ox + x) * GAP, (oy + y) * GAP, (oz + z) * GAP);
  const scatter = new THREE.Vector3(target.x + (Math.random() - 0.5) * 25, target.y + (Math.random() - 0.5) * 25 + 3, target.z + (Math.random() - 0.5) * 25);
  mesh.position.copy(scatter); mesh.scale.setScalar(0.001);
  mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
  allCubes.push({ mesh, target, scatter, row: y, phase: Math.random() * Math.PI * 2, startRot: new THREE.Euler(mesh.rotation.x, mesh.rotation.y, mesh.rotation.z), intraDist: Math.sqrt((x - (W - 1) / 2) ** 2 + (z - (D - 1) / 2) ** 2), breatheOffset: 0 });
}

// Ek küpler
[{ tx: ox - 1.3, ty: oy - 1.8, tz: oz + 0.5, row: 0 }, { tx: ox - 0.8, ty: oy - 2.5, tz: oz + 1.3, row: 0 }, { tx: ox - 0.3, ty: oy - 2.2, tz: oz - 0.8, row: 0 }, { tx: ox + 4.3, ty: oy + 4.6, tz: oz + 3.4, row: 4 }, { tx: ox + 4.5, ty: oy + 2.7, tz: oz + 3.6, row: 3 }].forEach(e => {
  const mesh = new THREE.Mesh(geo, cubeMat);
  mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
  const target = new THREE.Vector3(e.tx, e.ty, e.tz);
  const scatter = new THREE.Vector3(target.x + (Math.random() - 0.5) * 22, target.y + (Math.random() - 0.5) * 22 + 3, target.z + (Math.random() - 0.5) * 22);
  mesh.position.copy(scatter); mesh.scale.setScalar(0.001);
  mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
  allCubes.push({ mesh, target, scatter, row: e.row, phase: Math.random() * Math.PI * 2, startRot: new THREE.Euler(mesh.rotation.x, mesh.rotation.y, mesh.rotation.z), intraDist: 2.5 + Math.random() * 2, breatheOffset: 0, rotSpeed: new THREE.Vector3((Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.008) });
});

// Küçük parça
const tinyMesh = new THREE.Mesh(new RoundedBoxGeometry(0.3, 0.3, 0.3, 3, 0.06), cubeMat);
scene.add(tinyMesh);
const tinyTarget = new THREE.Vector3(ox - 1.5, oy - 2.8, oz + 0.2);
const tinyScatter = new THREE.Vector3(tinyTarget.x + (Math.random() - 0.5) * 20, tinyTarget.y + (Math.random() - 0.5) * 18, tinyTarget.z + (Math.random() - 0.5) * 20);
tinyMesh.position.copy(tinyScatter); tinyMesh.scale.setScalar(0.001);
tinyMesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
allCubes.push({ mesh: tinyMesh, target: tinyTarget, scatter: tinyScatter, row: 0, phase: 0, startRot: new THREE.Euler(tinyMesh.rotation.x, tinyMesh.rotation.y, tinyMesh.rotation.z), intraDist: 3.5, breatheOffset: 0, rotSpeed: new THREE.Vector3(0.008, 0.006, 0.004) });

/* ══════════════════════════════════════
   3) ANİMASYON FAZLARI
   ══════════════════════════════════════ */
let phase = 'idle', phaseTime = 0;
const T_ASSEMBLE = 6.0, T_BREATHE = 4.5, T_DISSOLVE = 5.0;
const ASSEMBLE_ROW_GAP = 0.85, ASSEMBLE_CUBE_DUR = 2.2, ASSEMBLE_INTRA = 0.07;
const DISSOLVE_ROW_GAP = 0.75, DISSOLVE_CUBE_DUR = 2.0, DISSOLVE_INTRA = 0.05;
const BREATHE_ROW_GAP = 0.45, BREATHE_CUBE_DUR = 3.2, BREATHE_LIFT = 0.22;

function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeInCubic(t) { return t * t * t; }
function breatheCurve(t) { return (t <= 0 || t >= 1) ? 0 : Math.sin(t * Math.PI); }
function getAssembleDelay(c) { return Math.max(0, Math.min(c.row, MAX_ROW)) * ASSEMBLE_ROW_GAP + c.intraDist * ASSEMBLE_INTRA; }
function getDissolveDelay(c) { return (MAX_ROW - Math.max(0, Math.min(c.row, MAX_ROW))) * DISSOLVE_ROW_GAP + c.intraDist * DISSOLVE_INTRA; }
function getBreatheDelay(c) { return Math.max(0, Math.min(c.row, MAX_ROW)) * BREATHE_ROW_GAP; }

/* ══════════════════════════════════════
   4) ANİMASYON DÖNGÜSÜ
   ══════════════════════════════════════ */
const clock = new THREE.Clock();
const mouse = new THREE.Vector2(999, 999);
const raycaster = new THREE.Raycaster();
let hovered = null;
renderer.domElement.addEventListener('mousemove', e => { mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1; });

let frames = 0, lastTime = performance.now();
function updateFPS() { frames++; const now = performance.now(); if (now - lastTime >= 1000) { document.getElementById('fps').textContent = frames + ' FPS'; frames = 0; lastTime = now; } }

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta(), t = clock.getElapsedTime();
  if (!loaderDone || redirectStarted) { renderer.render(scene, camera); return; }

  phaseTime += delta;
  if (phase === 'idle') { phase = 'assemble'; phaseTime = 0; }
  if (phase === 'assemble' && phaseTime >= T_ASSEMBLE) { phase = 'breathe'; phaseTime = 0; }
  else if (phase === 'breathe' && phaseTime >= T_BREATHE) { phase = 'dissolve'; phaseTime = 0; }
  else if (phase === 'dissolve' && phaseTime >= T_DISSOLVE) { phase = 'assemble'; phaseTime = 0; }

  for (const c of allCubes) {
    if (phase === 'assemble') {
      const delay = getAssembleDelay(c), localT = Math.max(0, phaseTime - delay), raw = Math.min(1, localT / ASSEMBLE_CUBE_DUR), e = easeOutBack(raw);
      const pos = new THREE.Vector3().lerpVectors(c.scatter, c.target, e);
      pos.y += Math.sin(raw * Math.PI) * 2.0;
      c.mesh.position.copy(pos); c.mesh.scale.setScalar(0.001 + e * 0.999);
      c.mesh.rotation.x = c.startRot.x * (1 - e); c.mesh.rotation.y = c.startRot.y * (1 - e); c.mesh.rotation.z = c.startRot.z * (1 - e);
    } else if (phase === 'breathe') {
      const delay = getBreatheDelay(c), localT = Math.max(0, phaseTime - delay), raw = Math.min(1, localT / BREATHE_CUBE_DUR), lift = breatheCurve(raw) * BREATHE_LIFT;
      c.mesh.position.set(c.target.x, c.target.y + lift, c.target.z); c.mesh.scale.setScalar(1); c.mesh.rotation.set(0, 0, 0);
      if (c.rotSpeed) { c.mesh.rotation.x = c.rotSpeed.x * Math.sin(t * 0.5 + c.phase) * 0.5; c.mesh.rotation.y = c.rotSpeed.y * Math.cos(t * 0.4 + c.phase) * 0.5; }
    } else if (phase === 'dissolve') {
      const delay = getDissolveDelay(c), localT = Math.max(0, phaseTime - delay), raw = Math.min(1, localT / DISSOLVE_CUBE_DUR), e = easeInCubic(raw);
      const pos = new THREE.Vector3().lerpVectors(c.target, c.scatter, e);
      pos.y += Math.sin(raw * Math.PI) * 1.5;
      c.mesh.position.copy(pos); c.mesh.scale.setScalar(Math.max(0.001, 1 - e));
      c.mesh.rotation.x = c.startRot.x * e; c.mesh.rotation.y = c.startRot.y * e; c.mesh.rotation.z = c.startRot.z * e;
    }
  }

  pinkA.intensity = 3.5 + Math.sin(t * 0.4) * 0.6 + ((phase === 'breathe') ? Math.sin(phaseTime * 1.2) * 0.8 : 0);
  pinkB.intensity = 2 + Math.sin(t * 0.3 + 1) * 0.4;
  pinkC.intensity = 1.5 + Math.sin(t * 0.35 + 2) * 0.3;

  if (phase === 'breathe') {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(allCubes.map(c => c.mesh));
    if (hovered) { hovered.scale.lerp(new THREE.Vector3(1, 1, 1), 0.04); hovered = null; }
    if (hits.length > 0) { hovered = hits[0].object; hovered.scale.lerp(new THREE.Vector3(1.12, 1.12, 1.12), 0.04); }
  } else if (hovered) { hovered.scale.setScalar(1); hovered = null; }

  updateFPS();
  renderer.render(scene, camera);
}

animate();
fillLoader();
initMusic();

window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
